#cloud-config
autoinstall:
  version: 1
  apt:
    geoip: true
    disable_components: []
    preserve_sources_list: false
    primary:
      - arches: [amd64, i386]
        uri: http://us.archive.ubuntu.com/ubuntu
      - arches: [default]
        uri: http://ports.ubuntu.com/ubuntu-ports
  # LEAVE! This keeps packer from erroring out on SSH auth while install is happening
  early-commands:
    - sudo systemctl stop ssh
  locale: en_US
  keyboard:
    layout: us
  identity:
    hostname: ${hostname}
    username: ${username}
    password: ${password}
  ssh:
    install-server: true
    allow-pw: yes
  packages:
    - openssh-server
    - open-vm-tools
    - cloud-init
    - whois
    - zsh
    - wget
    - tasksel
    - ubuntu-desktop
  source:
    id: ubuntu-server-minimal
  user-data:
    disable_root: false
    timezone: UTC
    write_files:
      - path: /etc/gdm3/custom.conf
        content: |
          [daemon]
          AutomaticLoginEnable = true
          AutomaticLogin = ${username}

          [security]

          [xdmcp]

          [chooser]

          [debug]
system_info:
  users:
    - default
  default_user:
    name: ${username}
    lock_passwd: True
    gecos: DefaultUser
    groups: [adm, audio, cdrom, dialout, dip, floppy, lxd, netdev, plugdev, sudo, video]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
